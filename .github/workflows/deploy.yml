name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Navigate and Pull
            cd ~/sponsCRM
            git pull origin main

            # 2. Re-prune (Crucial for Turborepo structure changes)
            npx turbo prune backend --docker
            
            # 3. Move to isolated files and install
            cd out/full
            npm install
            
            # 4. Generate Prisma Client (Since we saw this is needed)
            cd apps/backend
            npx prisma generate
            
            # 5. Restart with our specific tsx command
            # This ensures it uses the same command that worked manually
            pm2 restart "spons-backend" || pm2 start "npx tsx src/index.ts" --name "spons-backend"